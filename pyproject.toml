[project]
name = "steam-local-randomizer"
description = "Pick a random game from your locally installed Steam library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dynamic = ["version"]
dependencies = [
    "vdf>=3.4",
    "customtkinter>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
steam-randomizer = "steam_randomizer.cli:main"
steam-randomizer-gui = "steam_randomizer.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "steam_randomizer.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"