name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            ext: ".exe"
            os_name: "windows"
          - os: ubuntu-latest
            ext: ""
            os_name: "linux"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk patchelf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          python -m pip install -e ".[dev]" --no-build-isolation
          pip install pyinstaller pytest

      - name: Run tests
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            # Если тесты используют GUI, xvfb создаст виртуальный дисплей
            # Если тесты только для CLI, можно оставить просто pytest
            # sudo apt-get install -y xvfb (добавьте выше, если нужно)
            pytest 
          else
            pytest
          fi
        shell: bash

      # Добавляем -${{ matrix.os_name }} к имени файла
      - name: Build GUI
        run: pyinstaller --onefile --windowed --name steam-randomizer-gui-${{ matrix.os_name }} --paths src --collect-all vdf --collect-all customtkinter run_gui.py

      - name: Build CLI
        run: pyinstaller --onefile --console --name steam-randomizer-${{ matrix.os_name }} --paths src --collect-all vdf run.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os_name }}
          path: |
            dist/steam-randomizer-gui-${{ matrix.os_name }}${{ matrix.ext }}
            dist/steam-randomizer-${{ matrix.os_name }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/steam-randomizer-gui-windows.exe
            dist/steam-randomizer-windows.exe
            dist/steam-randomizer-gui-linux
            dist/steam-randomizer-linux