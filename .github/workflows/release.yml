name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Если Linux упадет, Windows всё равно соберется
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            ext: ".exe"
          - os: ubuntu-latest
            ext: ""

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # python3-tk нужен для customtkinter/tkinter
          # patchelf нужен PyInstaller'у для корректной упаковки .so библиотек в --onefile
          sudo apt-get install -y python3-tk patchelf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          python -m pip install -e ".[dev]" --no-build-isolation
          # Устанавливаем явно, чтобы не зависеть от того, прописаны ли они в pyproject.toml
          pip install pyinstaller pytest

      - name: Run tests
        run: pytest
        # Если ваши тесты пытаются открыть GUI окно (customtkinter), в Linux CI это упадет
        # из-за отсутствия дисплея. В таком случае замените строку выше на:
        # run: xvfb-run -a pytest (и добавьте xvfb в apt-get install выше)

      - name: Build GUI
        run: pyinstaller --onefile --windowed --name steam-randomizer-gui --paths src --collect-all vdf --collect-all customtkinter run_gui.py

      - name: Build CLI
        run: pyinstaller --onefile --console --name steam-randomizer --paths src --collect-all vdf run.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            dist/steam-randomizer-gui${{ matrix.ext }}
            dist/steam-randomizer${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true # Складывает файлы из разных OS в одну папку dist/

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/steam-randomizer-gui.exe
            dist/steam-randomizer.exe
            dist/steam-randomizer-gui
            dist/steam-randomizer