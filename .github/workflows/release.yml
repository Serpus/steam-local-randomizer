name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          python -m pip install -e ".[dev]" --no-build-isolation

      - name: Run tests
        run: pytest

      - name: Build GUI exe
        run: pyinstaller --onefile --windowed --name steam-randomizer-gui --paths src --collect-all vdf --collect-all customtkinter run_gui.py

      - name: Build CLI exe
        run: pyinstaller --onefile --console --name steam-randomizer --paths src --collect-all vdf run.py

      - name: Attach exes to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/steam-randomizer-gui.exe
            dist/steam-randomizer.exe